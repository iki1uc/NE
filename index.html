<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NE · Negativ-Axiom · Prefetch · ECO</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:20px; }
pre { background:#111; padding:10px; border-left:3px solid #0f0; }
button { background:#0f0; color:#000; padding:10px 20px; border:none; cursor:pointer; }
</style>
</head>

<body>

<h1>NE · Negativ-Axiom · Prefetch · ECO</h1>

<button onclick="RUN_NE()">NE START</button>

<pre id="out">NE wartet…</pre>

<script type="module">

import { NE_AXIOM } from "./NegativAxiom.js";
import { NE_PREFETCH } from "./Prefetch.js";
import { NE_LOAD_LOGIC } from "./ECO.js";
import { NE_GHOST } from "./Layer.js";
import { NE_VERIFY } from "./Verify.js";

async function RUN_NE() {

    const pre = await NE_PREFETCH();
    const logic = await NE_LOAD_LOGIC();

    const ghost = NE_GHOST(pre);
    const verify = NE_VERIFY(pre.alt.tmpDA, pre.alt.tmpBEN, pre.alt.tmpNE);

    const eco = logic.score.length % 100;

    const out = {
        axiome: NE_AXIOM,
        prefetch: pre,
        logic,
        ghost,
        verify,
        eco,
        state: "NE-READY"
    };

    document.getElementById("out").innerText =
        JSON.stringify(out, null, 2);
}

</script>

</body>
</html>
